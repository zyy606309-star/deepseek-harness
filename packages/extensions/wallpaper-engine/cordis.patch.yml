# Wallpaper Engine bundle patch (integrated into the fork).
#
# Applied over the dsh-web-app layer. This bundle contributes ONE host row
# (the plugin that scans Wallpaper Engine and serves its media) and relies on
# its `dsh.client` manifest (in package.json) to load the browser half that
# draws the wallpaper behind the DSH GUI and adds the settings UI.
#
# A patch replaces the targeted row's whole `config`, so only additive
# `insert` rows appear here (we never override an existing shipped row).

- insert:
    - id: wallpaper-engine
      name: '@deepseek-ai/dsh-wallpaper-engine'
